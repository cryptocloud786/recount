<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recount - recompute the number</title>
<style>
  :root { --ink:#1b1b1b; --muted:#6b6b6b; --line:#e4e1da; --bg:#faf8f4; --ok:#1f7a4d; --bad:#b3261e; --warn:#a15c00; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  textarea { width:100%; min-height:90px; padding:12px; font:inherit; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .row { display:flex; gap:12px; align-items:center; margin:12px 0 28px; flex-wrap:wrap; }
  button { font:inherit; padding:10px 18px; border-radius:8px; border:0; background:var(--ink); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .mode { font-size:14px; color:var(--muted); }
  .step { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  .step h2 { font-size:15px; margin:0 0 8px; display:flex; justify-content:space-between; gap:8px; }
  .meta { font-weight:400; color:var(--muted); font-size:13px; }
  pre { background:#141414; color:#e9e9e9; padding:12px; border-radius:8px; overflow:auto; font-size:13px; margin:8px 0; }
  .out { color:#9fe0b4; }
  ul { margin:6px 0; padding-left:20px; }
  .verdict { font-size:22px; font-weight:700; padding:16px 18px; border-radius:10px; margin:18px 0; border:1px solid var(--line); background:#fff; }
  .ACCURATE { color:var(--ok); } .FALSE { color:var(--bad); } .MISLEADING, .UNVERIFIABLE { color:var(--warn); }
  .err { color:var(--bad); white-space:pre-wrap; }
  .warn { color:var(--warn); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Recount</h1>
  <p class="sub">Paste a numeric claim. Recount extracts the figures, finds official sources, recomputes the math in a real sandbox, and lets three model votes decide. Every call goes through the Otari gateway.</p>
  <textarea id="claim" placeholder="e.g. India's population grew from 1.32 billion in 2015 to 1.43 billion in 2023, an increase of more than 15 percent."></textarea>
  <div class="row">
    <button id="go">Recount it</button>
    <label class="mode"><input type="checkbox" id="replay"> replay recorded run (no key, no spend)</label>
    <span class="mode" id="status"></span>
  </div>
  <div id="result"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("/api/config").then(r => r.json()).then(c => {
  if (c.replay) { $("replay").checked = true; $("replay").disabled = true; }
  if (c.claim && !$("claim").value) $("claim").value = c.claim;
});

function renderStep(s) {
  const head = `<h2>${esc(s.name)} <span class="meta">${esc(s.model)}${s.fallback ? " · fallback" : ""} · $${(s.cost_usd||0).toFixed(6)}</span></h2>`;
  if (s.error) return `<div class="step">${head}<div class="err">${esc(s.error)}</div></div>`;
  const d = s.data || {};
  let body = "";
  if (s.name === "extract") {
    body = "<ul>" + (d.figures||[]).map(f => `<li>${esc(f.label)}: <b>${esc(f.value)}</b> ${esc(f.unit)} (${esc(f.year)})</li>`).join("") + "</ul>";
    if (d.formula) body += `<div class="meta">formula: ${esc(d.formula)}</div>`;
  } else if (s.name === "source") {
    body = "<ul>" + (d.official||[]).map(o => `<li>${esc(o.label)} ${esc(o.year)}: <b>${o.value == null ? "not found" : esc(o.value)}</b> ${esc(o.source)} ${o.url ? `<a href="${esc(o.url)}" target="_blank" rel="noopener">source</a>` : ""}</li>`).join("") + "</ul>";
    (d.web_searches||[]).forEach(w => body += `<div class="meta">web search “${esc(w.query)}” → ${w.sources.length} sources</div>`);
    if (d.notes) body += `<div class="meta">${esc(d.notes)}</div>`;
  } else if (s.name === "recompute") {
    (d.runs||[]).forEach((r, i) => body += `<div class="meta">sandbox run ${i+1} · executed in Otari's code sandbox</div><pre>${esc(r.code)}\n<span class="out">→ ${esc(r.output.trim())}</span></pre>`);
    if (d.warning) body += `<div class="warn">${esc(d.warning)}</div>`;
  } else if (s.name === "verdict") {
    body = "<ul>" + (d.answers||[]).map((a, i) => `<li><b class="${esc(d.votes[i])}">${esc(d.votes[i])}</b> ${esc(a.replace(/^VERDICT:\s*\w+\s*[-–]\s*/i, ""))}</li>`).join("") + "</ul>";
    body += `<div class="meta">routing policy served by ${esc(d.served_by)} · fallback ${esc(d.fallback)} · attempts ${esc(d.attempts)}</div>`;
  }
  return `<div class="step">${head}${body}</div>`;
}

$("go").onclick = async () => {
  $("go").disabled = true; $("status").textContent = "auditing… (live runs take about a minute)"; $("result").innerHTML = "";
  try {
    const r = await fetch("/api/audit", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({claim: $("claim").value, replay: $("replay").checked})});
    const a = await r.json();
    if (a.error) throw new Error(a.error);
    let html = `<div class="verdict ${esc(a.verdict)}">${esc(a.verdict)} <span class="meta">${a.agreement ? "votes " + esc(a.agreement) : ""} · spent $${a.spent_usd.toFixed(6)}${a.mode === "replay" ? " (recorded)" : ""}</span></div>`;
    if (a.stopped) html += `<div class="step err">Stopped early: ${esc(a.stopped)}</div>`;
    html += a.steps.map(renderStep).join("");
    $("result").innerHTML = html;
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = ""; $("result").innerHTML = `<div class="step err">${esc(e.message)}</div>`;
  } finally { $("go").disabled = false; }
};
</script>
</body>
</html>
